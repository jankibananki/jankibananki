<svg xmlns="http://www.w3.org/2000/svg" width="620" height="600" viewBox="0 0 620 600" role="img" aria-labelledby="title desc">
<title id="title">Jana Marković — ASCII portrait</title>
<desc id="desc">A terminal-style ASCII portrait generated from Jana's photograph.</desc>
<defs>
  <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/>
    <stop offset="0.5" stop-color="#f472b6"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="asciiGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#c084fc"/>
    <stop offset="0.48" stop-color="#f472b6"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.25" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .ascii { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 9.4px; fill: url(#asciiGradient); letter-spacing: 0; }
    .cursor { animation: blink 1s steps(2,end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</defs>
